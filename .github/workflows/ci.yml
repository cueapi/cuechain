name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck, Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check bundle size
        run: |
          ESM_SIZE=$(wc -c < dist/index.js)
          echo "ESM bundle: ${ESM_SIZE} bytes"
          if [ "$ESM_SIZE" -gt 20480 ]; then
            echo "ERROR: Bundle size exceeds 20KB limit"
            exit 1
          fi
